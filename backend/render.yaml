services:
  - type: web
    name: indian-stock-scanner-backend
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 2 --threads 4 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 app:app
    envVars:
      - key: RENDER
        value: true
      - key: FLASK_ENV
        value: production
      - key: BINANCE_API_KEY
        sync: false

  - type: web
    name: quant-backend
    env: python
    plan: free
    region: frankfurt
    rootDir: quant-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TRENDLYNE_MCP_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: WATCHLIST_LIMIT
        value: "100"
      - key: FUNDAMENTALS_MAX_AGE_DAYS
        value: "10"
